
# ============================================================
# Estação Meteorológica IoT — App2 LocalizacaoGPS
#
# Configurações do Gradle Wrapper.
#
# Define a versão do Gradle utilizada pelo projeto,
# os diretórios de armazenamento e as verificações
# realizadas durante o download da distribuição.
#
# O Gradle Wrapper permite executar o projeto com a
# versão configurada, mesmo em outros computadores.
# ============================================================

# Data registrada na geração original do arquivo.
#Sun Nov 01 16:24:24 GMT-03:00 2026

# Define o diretório base onde as distribuições
# do Gradle serão armazenadas.
distributionBase=GRADLE_USER_HOME

# Define o caminho relativo utilizado para armazenar
# as distribuições baixadas pelo Gradle Wrapper.
distributionPath=wrapper/dists

# Hash SHA-256 utilizado para verificar a integridade
# do arquivo ZIP da distribuição do Gradle.
#
# Ajuda a detectar arquivos alterados ou corrompidos
# durante o download.
distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01

# Endereço oficial da distribuição Gradle 9.6.0.
#
# O sufixo -bin indica a distribuição binária,
# utilizada para executar as tarefas de compilação.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip

# Tempo máximo de espera de rede, em milissegundos.
# 10000 milissegundos equivalem a 10 segundos.
networkTimeout=10000

# Habilita a validação da URL de distribuição
# durante o processo de configuração do Wrapper.
validateDistributionUrl=true

# Define o diretório base utilizado para armazenar
# o arquivo ZIP da distribuição do Gradle.
zipStoreBase=GRADLE_USER_HOME

# Caminho relativo utilizado para armazenar o ZIP.
zipStorePath=wrapper/dists
