
# ============================================================
# Estação Meteorológica IoT — App2 LocalizacaoGPS
#
# Arquivo de configurações gerais do Gradle.
#
# Define parâmetros utilizados durante a compilação
# e sincronização do aplicativo Android.
#
# Configurações específicas do ambiente ou da IDE
# podem sobrescrever determinadas propriedades.
# ============================================================

# Define os argumentos da Máquina Virtual Java (JVM)
# utilizada pelo processo de compilação do Gradle.
#
# -Xmx2048m:
# Estabelece o limite máximo de memória heap em 2048 MB.
#
# -Dfile.encoding=UTF-8:
# Define a codificação de caracteres UTF-8.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Configuração opcional de execução paralela do Gradle.
#
# Pode permitir que tarefas de diferentes projetos sejam
# executadas simultaneamente em configurações compatíveis.
#
# Atualmente está desativada, pois permanece comentada.
# org.gradle.parallel=true

# Habilita o Configuration Cache do Gradle.
#
# Permite reutilizar configurações de compilações anteriores
# quando não ocorreram mudanças que invalidem o cache.
#
# Ajuda a reduzir o tempo de configuração do projeto.
org.gradle.configuration-cache=true

# Define o estilo oficial de código Kotlin utilizado
# pelas ferramentas de desenvolvimento.
kotlin.code.style=official

# Desativa a verificação de caracteres não ASCII no
# caminho do projeto pelo Android Gradle Plugin.
#
# Foi utilizada porque o projeto está localizado em:
# C:\Users\Lucas\Desktop\00 - COPIAS DE SEGURANÇA
#
# O nome da pasta contém o caractere especial "Ç".
#
# Esta opção não elimina todos os possíveis problemas
# associados a caminhos com caracteres especiais.
android.overridePathCheck=true
