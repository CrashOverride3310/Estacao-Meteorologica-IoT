
# ============================================================
# ESTAÇÃO METEOROLÓGICA IoT — BACKEND
# ============================================================
#
# Arquivo: gradle-wrapper.properties
# Sistema de build: Gradle
#
# Responsabilidades:
# - Definir a versão do Gradle utilizada pelo projeto.
# - Configurar o download da distribuição.
# - Definir os diretórios de armazenamento.
# - Habilitar a validação da URL.
# ============================================================

# Define o diretório base de armazenamento do Gradle.
distributionBase=GRADLE_USER_HOME

# Caminho relativo das distribuições do Gradle.
distributionPath=wrapper/dists

# Endereço oficial da distribuição Gradle 9.8.2.
#
# A versão binária contém os arquivos necessários
# para executar as tarefas de compilação do projeto.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.2-bin.zip

# Tempo máximo de espera de rede: 10 segundos.
networkTimeout=10000

# Habilita a validação da URL de distribuição.
validateDistributionUrl=true

# Define o diretório base para armazenar o ZIP.
zipStoreBase=GRADLE_USER_HOME

# Define o caminho relativo do arquivo ZIP.
zipStorePath=wrapper/dists
