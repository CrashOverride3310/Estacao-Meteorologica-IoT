
# ============================================================
# Estação Meteorológica IoT — App1 Dashboard Android
#
# Configurações gerais do Gradle utilizadas durante
# a compilação e a sincronização do projeto Android.
#
# As configurações definidas pelo Android Studio podem
# sobrescrever algumas propriedades deste arquivo.
# ============================================================

# Define os argumentos utilizados pela Máquina Virtual Java (JVM)
# responsável pela execução do Gradle.
#
# -Xmx2048m: estabelece o limite máximo de memória em 2048 MB.
# -Dfile.encoding=UTF-8: utiliza a codificação UTF-8.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Permite a execução paralela de tarefas e projetos Gradle.
# Atualmente está desativada porque a linha está comentada.
# Seu uso depende da compatibilidade e da estrutura do projeto.
# org.gradle.parallel=true

# Habilita o Configuration Cache do Gradle.
#
# Permite reutilizar configurações de compilações anteriores,
# evitando executar novamente etapas desnecessárias.
#
# Pode melhorar o desempenho durante o desenvolvimento.
org.gradle.configuration-cache=true

# Define o estilo oficial de formatação do código Kotlin.
kotlin.code.style=official

# Desativa a verificação de caracteres não ASCII
# no caminho do projeto pelo Android Gradle Plugin.
#
# Necessário nesta configuração porque a pasta
# "00 - COPIAS DE SEGURANÇA" contém o caractere "Ç".
#
# Esta propriedade não elimina possíveis problemas
# de compatibilidade causados por caracteres especiais.
android.overridePathCheck=true
