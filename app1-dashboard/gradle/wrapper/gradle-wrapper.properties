
# ============================================================
# Estação Meteorológica IoT — App1 Dashboard Android
#
# Configuração do Gradle Wrapper.
#
# Define a versão do Gradle utilizada pelo projeto,
# os diretórios de armazenamento e as verificações
# realizadas durante o download da distribuição.
#
# O Gradle Wrapper permite que outros desenvolvedores
# utilizem a versão correta do Gradle ao clonar
# o projeto no GitHub.
# ============================================================

# Data registrada na geração original do arquivo.
#Sun Sep 27 02:19:12 GMT-03:00 2026

# Define o diretório base utilizado para armazenar
# as distribuições do Gradle.
distributionBase=GRADLE_USER_HOME

# Caminho relativo onde as distribuições são armazenadas.
distributionPath=wrapper/dists

# Hash SHA-256 utilizado para verificar a integridade
# do arquivo de distribuição baixado.
distributionSha256Sum=bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01

# Endereço oficial de download do Gradle 9.6.0.
# A versão será utilizada na compilação do aplicativo.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.6.0-bin.zip

# Tempo máximo de espera da conexão, em milissegundos.
# 10000 milissegundos correspondem a 10 segundos.
networkTimeout=10000

# Habilita a validação da URL da distribuição.
validateDistributionUrl=true

# Define o diretório base onde o arquivo ZIP é armazenado.
zipStoreBase=GRADLE_USER_HOME

# Caminho relativo para armazenamento do ZIP.
zipStorePath=wrapper/dists
